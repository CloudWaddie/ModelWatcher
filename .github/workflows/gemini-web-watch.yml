name: Gemini Web App Tracker

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-web-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure logs folder exists
        run: mkdir -p logs

      - name: Run Gemini Web App tracker
        env:
          TOMBSTONE_WEBHOOK: ${{ secrets.TOMBSTONE_WEBHOOK }}
        run: npm run gemini-web

      - name: Run Antigravity tracker
        if: ${{ !cancelled() }}
        env:
          TOMBSTONE_WEBHOOK: ${{ secrets.TOMBSTONE_WEBHOOK }}
        run: npm run antigravity

      - name: Commit results to master
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name "ModelWatcher"
          git config --global user.email "modelwatcher@github.com"

          # Stash fresh state, sync to master (other bots push here too), restore, commit.
          mkdir -p /tmp/web-state
          cp logs/*-web-state.json /tmp/web-state/ 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            mkdir -p logs
            cp /tmp/web-state/*-web-state.json logs/ 2>/dev/null || true
            git add -f logs/*-web-state.json || true
            if git diff --quiet --staged; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Update Gemini web trackers state - $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin master; then
              echo "Pushed (attempt $attempt)"
              exit 0
            fi
            echo "Push raced with another commit, retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push state after retries" >&2
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          ERROR_WEBHOOK: ${{ secrets.ERROR_WEBHOOK }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ERROR_WEBHOOK" ]; then echo "ERROR_WEBHOOK not set - skipping failure ping"; exit 0; fi
          jq -n --arg c "<@1366222155720687646> ❌ **$WORKFLOW_NAME** failed: $RUN_URL" \
            '{content: $c, allowed_mentions: {users: ["1366222155720687646"]}}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$ERROR_WEBHOOK" || true
