name: Gemini Web App Tracker

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      sparkly_test:
        description: Send a seeded Sparkly test to Discord
        type: boolean
        default: false
      sparkly_replay:
        description: Review ten historical tracker changes without sending Discord alerts
        type: boolean
        default: false
      sparkly_replay_revision:
        description: Optional captured revision to replay by itself
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: gemini-web-watch
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ !inputs.sparkly_replay }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ !inputs.sparkly_test }}
        run: npm ci

      - name: Ensure logs folder exists
        if: ${{ !inputs.sparkly_test }}
        run: mkdir -p logs

      - name: Run Gemini Web App tracker
        if: ${{ !inputs.sparkly_test }}
        env:
          TOMBSTONE_WEBHOOK: ${{ secrets.TOMBSTONE_WEBHOOK }}
        run: npm run gemini-web

      - name: Run Antigravity tracker
        if: ${{ !cancelled() && !inputs.sparkly_test }}
        env:
          TOMBSTONE_WEBHOOK: ${{ secrets.TOMBSTONE_WEBHOOK }}
        run: npm run antigravity

      - name: Commit results to master
        if: ${{ !cancelled() && !inputs.sparkly_test }}
        run: |
          git config --global user.name "ModelWatcher"
          git config --global user.email "modelwatcher@github.com"

          # Stash fresh state, sync to master (other bots push here too), restore, commit.
          mkdir -p /tmp/web-state
          cp logs/*-web-state.json /tmp/web-state/ 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            mkdir -p logs
            cp /tmp/web-state/*-web-state.json logs/ 2>/dev/null || true
            git add -f logs/*-web-state.json || true
            if git diff --quiet --staged; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Update Gemini web trackers state - $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin master; then
              echo "Pushed (attempt $attempt)"
              exit 0
            fi
            echo "Push raced with another commit, retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push state after retries" >&2
          exit 1

      - name: Run Sparkly review
        if: ${{ !cancelled() }}
        env:
          SPARKLY_DATA: ${{ secrets.SPARKLY_DATA }}
          SPARKLY_WEBHOOK: ${{ secrets.SPARKLY_WEBHOOK }}
          SPARKLY_ALERT_EMOJI: ${{ vars.SPARKLY_ALERT_EMOJI }}
          SPARKLY_TEST: ${{ inputs.sparkly_test }}
        run: |
          if [ "$SPARKLY_TEST" = "true" ]; then
            node src/sparkly.js --test
          else
            node src/sparkly.js
          fi

      - name: Notify on failure
        if: ${{ failure() && !inputs.sparkly_test }}
        env:
          ERROR_WEBHOOK: ${{ secrets.ERROR_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f src/notify-error.js ]; then
            node src/notify-error.js
          elif [ -n "$ERROR_WEBHOOK" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "{\"content\":\"<@1366222155720687646> ❌ ${GITHUB_WORKFLOW} failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"allowed_mentions\":{\"users\":[\"1366222155720687646\"]}}" \
              "$ERROR_WEBHOOK" || true
          fi


  sparkly-replay:
    if: ${{ inputs.sparkly_replay }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review historical fixtures
        env:
          SPARKLY_DATA: ${{ secrets.SPARKLY_DATA }}
          SPARKLY_REPLAY_REVISION: ${{ inputs.sparkly_replay_revision }}
        run: node tests/sparkly-replay.js
